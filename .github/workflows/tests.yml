name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest onnx onnxruntime onnxscript nbformat
      - name: Unit tests
        run: pytest -v
      - name: Validate notebooks
        run: |
          python - <<'EOF'
          import glob, nbformat
          for p in sorted(glob.glob("notebooks/*.ipynb")):
              nb = nbformat.read(p, as_version=4)
              nbformat.validate(nb)
              for c in nb.cells:
                  if c.cell_type == "code":
                      src = "\n".join("#" + l if l.lstrip().startswith(("!", "%")) else l for l in c.source.splitlines())
                      compile(src, p, "exec")
              print("ok", p, len(nb.cells), "cells")
          EOF
